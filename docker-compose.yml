version: "3.9"

services:
  node1:
    build: .
    container_name: kv-node-1
    command: python -m src.server --host 0.0.0.0 --port 7171
    environment:
      - NODE_ID=1
    ports:
      - "7171:7171"

  node2:
    build: .
    container_name: kv-node-2
    command: python -m src.server --host 0.0.0.0 --port 7171
    environment:
      - NODE_ID=2
    ports:
      - "7172:7171"

  node3:
    build: .
    container_name: kv-node-3
    command: python -m src.server --host 0.0.0.0 --port 7171
    environment:
      - NODE_ID=3
    ports:
      - "7173:7171"
